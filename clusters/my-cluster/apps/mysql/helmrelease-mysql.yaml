apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: mysql
  namespace: mysql
spec:
  interval: 5m
  chart:
    spec:
      chart: mysql
      sourceRef:
        kind: HelmRepository
        name: bitnami
        namespace: flux-system
      version: "12.4.0"
  install:
    createNamespace: true
  values:
    primary:
      persistence:
        enabled: true
        size: 5Gi
    auth:
      existingSecret: mysql-root-password
      existingSecretKey: mysql-root-password

