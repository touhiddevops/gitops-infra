apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: wordpress
  namespace: wordpress
spec:
  interval: 5m
  chart:
    spec:
      chart: wordpress
      sourceRef:
        kind: HelmRepository
        name: bitnami
        namespace: flux-system
      version: "16.0.0"
  install:
    createNamespace: true
  values:
    mariadb:
      enabled: false
    externalDatabase:
      host: mysql-primary.mysql.svc.cluster.local
      user: root
      password: ""
      database: wordpress
      existingSecret: mysql-root-password
      existingSecretKey: mysql-root-password
    service:
      type: ClusterIP
    ingress:
      enabled: true
      ingressClassName: "nginx"
      hostname: app.local
      pathType: ImplementationSpecific
      tls: []

